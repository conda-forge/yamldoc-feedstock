{% set name = "yamldoc" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/yamldoc-{{ version }}.tar.gz
  sha256: 5a4be0db626765d5245e1c6e52de03e05c796e223f759c20f660e94fd30ba129

build:
  entry_points:
    - yamldoc = yamldoc:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6

test:
  imports:
    - yamldoc
  commands:
    - pip check
    - yamldoc --help
  requires:
    - pip

about:
  home: https://github.com/Chris1221/yamldoc
  doc_url: https://chrisbcole.me/yamldoc/
  summary: Documentation engine for YAML.
  # PR made upstream to package in license
  license_file: LICENSE
  license: MIT

extra:
  recipe-maintainers:
    - thewchan
