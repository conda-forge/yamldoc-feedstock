{% set name = "yamldoc" %}
{% set version = "0.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/yamldoc-{{ version }}.tar.gz
  sha256: 9f97f113f541d7555af94b271e42b124a5273b485543db6a18058760d3bee5e9

build:
  entry_points:
    - yamldoc = yamldoc:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - yamldoc
  commands:
    - pip check
    - yamldoc --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Chris1221/yamldoc
  doc_url: https://chrisbcole.me/yamldoc/
  summary: Documentation engine for YAML.
  # PR made upstream to package in license
  license_file: LICENSE
  license: MIT

extra:
  recipe-maintainers:
    - thewchan
